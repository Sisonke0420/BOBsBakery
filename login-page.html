<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login Page</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Manrope:wght@200..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- keep a single stylesheet reference above -->
</head>
<body>
 


  <div class="container">
    <div class="form-box login">
      <form action="">
         <h1>Login</h1>
        <div class="input-box">
          <input id="password-input" type="password" placeholder="Password" required>
          <i class="fa-solid fa-lock"></i>
        </div>
        <div class="forgot-link">
          <a href="#">Forgot password?</a>
        </div>
        <button id="login-button" class="btn-login" type="button">Login</button>
        <p>or login with social platform</p>
        <div class="social-icons">
          <a href="#" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
          <a href="#" title="Google"><i class="fa-brands fa-google"></i></a>
          <a href="#" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
        </div>
      </form>
    </div>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
